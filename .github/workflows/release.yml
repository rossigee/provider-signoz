name: Release

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY_ORGS: ghcr.io/rossigee
  GO_REQUIRED_VERSION: 1.26.6

permissions:
  packages: write
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_REQUIRED_VERSION }}
          enable-cache: true
          cache-dependency-path: |
            go.sum
            go.mod

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Version: ${VERSION}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run code generation
        run: make generate

      - name: Check go.mod is up to date
        run: |
          go mod tidy
          git diff --exit-code

      - name: Run unit tests
        run: make test

      - name: Run linting
        run: make lint

      - name: Vendor dependencies
        run: go mod vendor

      - name: Build provider runtime image
        run: make VERSION=${{ steps.version.outputs.version }} PLATFORMS=linux_amd64 build

      - name: Build Crossplane package (xpkg)
        run: make VERSION=${{ steps.version.outputs.version }} PLATFORMS=linux_amd64 xpkg.build

      - name: Push Crossplane package (xpkg)
        run: make VERSION=${{ steps.version.outputs.version }} PLATFORMS=linux_amd64 "xpkg.release.publish.${{ env.REGISTRY_ORGS }}.provider-signoz"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ github.event.repository.name }} ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true

      - name: Verify published artifacts
        run: |
          echo "Verifying published artifacts..."
          docker pull ${{ env.REGISTRY_ORGS }}/provider-signoz:${{ steps.version.outputs.version }} && echo "✓ Docker image published" || echo "✗ Docker image not found"
          echo "Release complete: ${{ steps.version.outputs.version }}"